# Ruffbus Mamer prototype.  docker compose up --build   then open http://localhost:8000
# With HTTPS on a public name: set DOMAIN, COOKIE_SECURE=true, FORWARDED_ALLOW_IPS=*, APP_BIND=127.0.0.1 in .env,
# then  docker compose --profile https up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ruffbus
      POSTGRES_USER: ruffbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruffbus}
      TZ: Europe/Luxembourg
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruffbus -d ruffbus"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ruffbus:${POSTGRES_PASSWORD:-ruffbus}@db:5432/ruffbus
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-secret}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_DAILY_RESET: ${DEMO_DAILY_RESET:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      SMS_RETENTION_DAYS: ${SMS_RETENTION_DAYS:-7}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      TZ: Europe/Luxembourg
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
